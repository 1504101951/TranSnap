name: transnap
description: macOS 26+ 全局选区翻译。Flutter/Dart 负责应用与业务；Swift 提供系统桥与原生玻璃材料。
publish_to: "none"
# Release metadata supplies the macOS app version and build number.
version: 1.0.4+24

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  characters: ^1.4.1
  crypto: ^3.0.7
  sqlite3: ^3.6.0
  motor: ^1.1.0
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/optical_prism.frag
  assets:
    - assets/fonts/licenses/
  fonts:
    - family: TranSnap Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: TranSnap NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: TranSnap Name neutral
      fonts:
        - asset: assets/fonts/names/neutral.ttf
    - family: TranSnap Name neutral Title
      fonts:
        - asset: assets/fonts/names/neutral-title.ttf
    - family: TranSnap Name neutral Text
      fonts:
        - asset: assets/fonts/names/neutral-text.ttf
    - family: TranSnap Name geometric
      fonts:
        - asset: assets/fonts/names/geometric.ttf
    - family: TranSnap Name geometric Title
      fonts:
        - asset: assets/fonts/names/geometric-title.ttf
    - family: TranSnap Name geometric Text
      fonts:
        - asset: assets/fonts/names/geometric-text.ttf
    - family: TranSnap Name claude
      fonts:
        - asset: assets/fonts/names/claude.ttf
    - family: TranSnap Name claude Title
      fonts:
        - asset: assets/fonts/names/claude-title.ttf
    - family: TranSnap Name claude Text
      fonts:
        - asset: assets/fonts/names/claude-text.ttf
    - family: TranSnap Name humanist
      fonts:
        - asset: assets/fonts/names/humanist.ttf
    - family: TranSnap Name humanist Title
      fonts:
        - asset: assets/fonts/names/humanist-title.ttf
    - family: TranSnap Name humanist Text
      fonts:
        - asset: assets/fonts/names/humanist-text.ttf
    - family: TranSnap Name rounded
      fonts:
        - asset: assets/fonts/names/rounded.ttf
    - family: TranSnap Name rounded Title
      fonts:
        - asset: assets/fonts/names/rounded-title.ttf
    - family: TranSnap Name rounded Text
      fonts:
        - asset: assets/fonts/names/rounded-text.ttf
    - family: TranSnap Name bookish
      fonts:
        - asset: assets/fonts/names/bookish.ttf
    - family: TranSnap Name bookish Title
      fonts:
        - asset: assets/fonts/names/bookish-title.ttf
    - family: TranSnap Name bookish Text
      fonts:
        - asset: assets/fonts/names/bookish-text.ttf
    - family: TranSnap Name character
      fonts:
        - asset: assets/fonts/names/character.ttf
    - family: TranSnap Name character Title
      fonts:
        - asset: assets/fonts/names/character-title.ttf
    - family: TranSnap Name character Text
      fonts:
        - asset: assets/fonts/names/character-text.ttf
    - family: TranSnap Name legible
      fonts:
        - asset: assets/fonts/names/legible.ttf
    - family: TranSnap Name legible Title
      fonts:
        - asset: assets/fonts/names/legible-title.ttf
    - family: TranSnap Name legible Text
      fonts:
        - asset: assets/fonts/names/legible-text.ttf
